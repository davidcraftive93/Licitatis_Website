name: Deploy a Hostinger (manual)

# Despliegue de PRODUCCIÓN a Hostinger.
# - Solo se ejecuta manualmente.
# - Requiere la confirmación exacta "DEPLOY LICITATIS".
# - Solo acepta commits que ya pertenezcan al historial de main, aunque el input sea una etiqueta.
# - Compila y transfiere únicamente el artefacto estático out/.

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Confirmación obligatoria. Escribe exactamente: DEPLOY LICITATIS"
        required: true
        type: string
      git_ref:
        description: "Rama, etiqueta o commit de main a desplegar."
        required: true
        default: "main"
        type: string
      permitir_placeholders_legales:
        description: >-
          Desplegar AUNQUE las páginas legales lleven datos sin resolver
          (o HubSpot no esté configurado). Solo para una beta consciente.
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-hostinger-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  guard:
    name: Confirmación manual
    runs-on: ubuntu-latest
    steps:
      - name: Validar confirmación exacta
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [ "$CONFIRMATION" != "DEPLOY LICITATIS" ]; then
            echo "::error::Confirmación incorrecta. Debes escribir exactamente: DEPLOY LICITATIS"
            exit 1
          fi
          echo "Confirmación válida."

  deploy:
    name: Validación, build y sincronización
    needs: guard
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout del ref solicitado
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.git_ref }}
          fetch-depth: 0

      - name: Verificar que el commit pertenece a main
        run: |
          git fetch origin +refs/heads/main:refs/remotes/origin/main --tags --force
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::El commit seleccionado no pertenece al historial de main. Una etiqueta no puede eludir esta regla."
            exit 1
          fi
          echo "OK: el commit está contenido en main."

      - name: Registrar commit a desplegar
        run: |
          SHA="$(git rev-parse HEAD)"
          echo "Desplegando commit: $SHA"
          echo "DEPLOY_SHA=$SHA" >> "$GITHUB_ENV"

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Validar calidad antes de producción
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
          npm run test

      - name: Build (export estático)
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_CONTACT_EMAIL: ${{ vars.NEXT_PUBLIC_CONTACT_EMAIL }}
          NEXT_PUBLIC_HUBSPOT_PORTAL_ID: ${{ vars.NEXT_PUBLIC_HUBSPOT_PORTAL_ID }}
          NEXT_PUBLIC_HUBSPOT_FORM_ID: ${{ vars.NEXT_PUBLIC_HUBSPOT_FORM_ID }}
          NEXT_PUBLIC_ENABLE_ANALYTICS: ${{ vars.NEXT_PUBLIC_ENABLE_ANALYTICS }}
          NEXT_PUBLIC_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID }}
        run: npm run build

      - name: Verificar artefacto y escribir sentinela
        run: |
          test -d out || { echo "::error::No existe out/"; exit 1; }
          test -f out/index.html || { echo "::error::No existe out/index.html"; exit 1; }
          printf '%s' "$DEPLOY_SHA" > out/__build_sha.txt
          echo "Artefacto out/ verificado."

      # El gate en modo producción bloquea si el HTML que se va a servir lleva datos
      # legales sin resolver o si HubSpot no está configurado.
      #
      # Antes este paso pasaba `--deploy` SIEMPRE, y esa opción degrada a aviso
      # exactamente esos dos bloqueantes: el gate decía PASS mientras las páginas
      # legales llevaban [LEGAL_REVIEW_REQUIRED], y el comentario de ci.yml aseguraba
      # que «el bloqueo duro ocurre en el workflow de despliegue». No ocurría en
      # ninguna parte.
      #
      # Ahora el bypass existe pero hay que pedirlo: la casilla
      # `permitir_placeholders_legales` queda registrada en el log de la ejecución,
      # así que desplegar una beta con textos legales pendientes es una decisión
      # deliberada y trazable, no el comportamiento por defecto.
      - name: Release gate legal (producción)
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_HUBSPOT_PORTAL_ID: ${{ vars.NEXT_PUBLIC_HUBSPOT_PORTAL_ID }}
          NEXT_PUBLIC_HUBSPOT_FORM_ID: ${{ vars.NEXT_PUBLIC_HUBSPOT_FORM_ID }}
          PERMITIR_PLACEHOLDERS: ${{ inputs.permitir_placeholders_legales }}
        run: |
          if [ "$PERMITIR_PLACEHOLDERS" = "true" ]; then
            echo "::warning::Se despliega con datos legales SIN RESOLVER por decisión explícita (permitir_placeholders_legales=true). Los placeholders y la falta de HubSpot pasan a ser avisos."
            node scripts/verify-legal-launch.mjs --mode production --deploy
          else
            node scripts/verify-legal-launch.mjs --mode production
          fi

      - name: Validar configuración de Hostinger
        env:
          DEPLOY_PATH: ${{ secrets.HOSTINGER_DEPLOY_PATH }}
          SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_USERNAME }}
        run: |
          # El ref que se despliega puede ser anterior a este script (se elige aparte
          # del workflow), y sin él la limpieza no ocurriría en silencio.
          if [ ! -f scripts/normalize-deploy-path.sh ]; then
            echo "::error::El ref desplegado no incluye scripts/normalize-deploy-path.sh. Despliega un commit que lo tenga."
            exit 1
          fi
          SSH_HOST="$(printf '%s' "$SSH_HOST" | tr -d '\r\n')"
          SSH_PORT="$(printf '%s' "$SSH_PORT" | tr -d '\r\n')"
          SSH_USER="$(printf '%s' "$SSH_USER" | tr -d '\r\n')"

          # Obligatorios: sin estos no hay forma de conectarse.
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_PORT" ] || [ -z "$SSH_USER" ]; then
            echo "::error::Falta HOSTINGER_HOST, HOSTINGER_PORT o HOSTINGER_USERNAME."
            exit 1
          fi
          case "$SSH_PORT" in
            *[!0-9]*) echo "::error::HOSTINGER_PORT debe ser numérico."; exit 1 ;;
          esac

          # HOSTINGER_DEPLOY_PATH es una PISTA, no un requisito: el docroot real lo
          # decide la sonda HTTP contra el propio servidor, y la lista de destinos
          # autorizados se calcula con el $HOME remoto, no con este secreto. Cuando
          # bloqueaba, cuatro despliegues murieron aquí sin que el valor aportara
          # ninguna garantía que la sonda no diera ya.
          HINT="$(sh scripts/normalize-deploy-path.sh 2>"$RUNNER_TEMP/hint_why.txt")"
          WHY="$(cat "$RUNNER_TEMP/hint_why.txt" 2>/dev/null || true)"
          if [ -n "$HINT" ]; then
            echo "Pista de docroot válida; la sonda mandará igualmente."
          elif [ -n "$WHY" ]; then
            echo "::warning::HOSTINGER_DEPLOY_PATH se ignora porque $WHY El docroot se detectará sondeando el servidor. Para quitar este aviso, escribe el secreto A MANO como '~/public_html'."
          else
            echo "HOSTINGER_DEPLOY_PATH vacío: el docroot se detectará sondeando el servidor."
          fi
          echo "Configuración básica de Hostinger validada."

      - name: Preparar clave SSH y comprobar conexión
        env:
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_USERNAME }}
        run: |
          SSH_HOST="$(printf '%s' "$SSH_HOST" | tr -d '\r\n')"
          SSH_PORT="$(printf '%s' "$SSH_PORT" | tr -d '\r\n')"
          SSH_USER="$(printf '%s' "$SSH_USER" | tr -d '\r\n')"

          if [ -z "$SSH_KEY" ]; then
            echo "::error::HOSTINGER_SSH_PRIVATE_KEY está vacío."
            exit 1
          fi

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s' "$SSH_KEY" | base64 -d > "$HOME/.ssh/id_deploy" 2>/dev/null || true
          chmod 600 "$HOME/.ssh/id_deploy" 2>/dev/null || true
          if ssh-keygen -y -f "$HOME/.ssh/id_deploy" >/dev/null 2>&1; then
            echo "Clave privada leída desde base64."
          else
            printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$HOME/.ssh/id_deploy"
            chmod 600 "$HOME/.ssh/id_deploy"
            echo "Clave privada leída como texto PEM."
          fi

          if ! ssh-keygen -y -f "$HOME/.ssh/id_deploy" >/dev/null 2>&1; then
            echo "::error::La clave SSH no es válida. Guarda la clave privada en base64 o PEM."
            exit 1
          fi

          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null
          chmod 600 "$HOME/.ssh/known_hosts"

          ssh -i "$HOME/.ssh/id_deploy" -p "$SSH_PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            "$SSH_USER@$SSH_HOST" "echo SSH_OK" >/dev/null
          echo "Conexión SSH correcta."

      - name: Detectar el docroot servido
        env:
          SSH_USER: ${{ secrets.HOSTINGER_USERNAME }}
          SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_PORT }}
          DEPLOY_PATH: ${{ secrets.HOSTINGER_DEPLOY_PATH }}
        run: |
          # La MISMA normalización que en el paso de validación: si cada paso limpiara
          # el secreto a su manera, acabarían comparando valores distintos.
          DEPLOY_PATH="$(sh scripts/normalize-deploy-path.sh)"
          SSH_PORT="$(printf '%s' "$SSH_PORT" | tr -d '\r\n')"
          SSH_USER="$(printf '%s' "$SSH_USER" | tr -d '\r\n')"
          SSH_HOST="$(printf '%s' "$SSH_HOST" | tr -d '\r\n')"
          SSHO="-i $HOME/.ssh/id_deploy -p $SSH_PORT -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20"

          REMOTE_HOME="$(ssh $SSHO "$SSH_USER@$SSH_HOST" 'printf "%s" "$HOME"')"
          test -n "$REMOTE_HOME" || { echo "::error::No se pudo obtener el HOME remoto."; exit 1; }

          # Los DOS únicos destinos que LICITATIS puede escribir. Se calculan con el
          # $HOME real del servidor, no con el secreto: esa es la garantía de verdad,
          # y por eso el secreto puede fallar sin comprometer nada.
          ALLOWED_PRIMARY="$REMOTE_HOME/public_html"
          ALLOWED_DOMAIN="$REMOTE_HOME/domains/licitatis.es/public_html"

          # La pista, si la hay. `~/...` se expande AQUÍ y nunca viaja como virgulilla
          # a rsync. El patrón va entre comillas ('~/'): sin ellas el shell expande la
          # virgulilla DENTRO del patrón y la ruta acabaría en «…/~/public_html».
          case "$DEPLOY_PATH" in
            "~/"*) DEPLOY_PATH="$REMOTE_HOME/${DEPLOY_PATH#'~/'}" ;;
          esac
          case "$DEPLOY_PATH" in
            "$ALLOWED_PRIMARY" | "$ALLOWED_DOMAIN") : ;;
            "") : ;;
            *)
              echo "::warning::HOSTINGER_DEPLOY_PATH apunta a un directorio que no es un docroot autorizado; se ignora."
              DEPLOY_PATH=""
              ;;
          esac

          # Sonda: se deja un fichero en cada candidato y se pide por HTTPS. El que
          # conteste ES el que sirve el dominio. Esto es empírico y se corrige solo.
          PROBE="__docroot_probe_${DEPLOY_SHA}.txt"
          ssh $SSHO "$SSH_USER@$SSH_HOST" 'PB="'"$PROBE"'"; for d in "$HOME/public_html" "$HOME/domains/licitatis.es/public_html"; do if [ -d "$d" ]; then printf "%s" "$d" > "$d/$PB"; fi; done'
          SERVED="$(curl -fsS "https://licitatis.es/$PROBE?cb=${DEPLOY_SHA}" 2>/dev/null | tr -d '\r\n' || true)"
          ssh $SSHO "$SSH_USER@$SSH_HOST" 'PB="'"$PROBE"'"; for d in "$HOME/public_html" "$HOME/domains/licitatis.es/public_html"; do rm -f "$d/$PB" 2>/dev/null || true; done'

          # Resolución por escalones, de más fiable a menos. Nunca se adivina.
          TARGET_DIR=""
          case "$SERVED" in
            "$ALLOWED_PRIMARY" | "$ALLOWED_DOMAIN")
              TARGET_DIR="$SERVED"
              echo "Docroot identificado por la sonda HTTP."
              if [ -n "$DEPLOY_PATH" ] && [ "$DEPLOY_PATH" != "$SERVED" ]; then
                echo "::warning::HOSTINGER_DEPLOY_PATH no coincide con el docroot que sirve el dominio. Manda la sonda; revisa el secreto."
              fi
              ;;
            "")
              echo "::warning::La sonda HTTP no identificó el docroot (¿dominio caído o caché?)."
              if [ -n "$DEPLOY_PATH" ] && ssh $SSHO "$SSH_USER@$SSH_HOST" "test -d '$DEPLOY_PATH'"; then
                TARGET_DIR="$DEPLOY_PATH"
                echo "Se usa la ruta configurada, que existe en el servidor."
              else
                # Sin sonda y sin pista: solo vale si UNO de los dos candidatos existe.
                EXISTS="$(ssh $SSHO "$SSH_USER@$SSH_HOST" 'for d in "$HOME/public_html" "$HOME/domains/licitatis.es/public_html"; do [ -d "$d" ] && printf "%s\n" "$d"; done')"
                COUNT="$(printf '%s\n' "$EXISTS" | grep -c . || true)"
                if [ "$COUNT" = "1" ]; then
                  TARGET_DIR="$(printf '%s' "$EXISTS" | tr -d '\r\n')"
                  echo "Un único docroot candidato existe en el servidor; se usa ese."
                else
                  echo "::error::No se puede determinar el docroot: la sonda no respondió y hay $COUNT candidatos. Define HOSTINGER_DEPLOY_PATH como '~/public_html' o revisa que el dominio responda."
                  exit 1
                fi
              fi
              ;;
            *)
              echo "::error::La sonda devolvió un docroot no autorizado."
              exit 1
              ;;
          esac

          test -n "$TARGET_DIR" || { echo "::error::No se resolvió ningún docroot."; exit 1; }
          echo "Docroot servido validado."
          echo "TARGET=$TARGET_DIR" >> "$GITHUB_ENV"

      - name: Crear copia de seguridad remota
        env:
          SSH_USER: ${{ secrets.HOSTINGER_USERNAME }}
          SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_PORT }}
        run: |
          SSH_PORT="$(printf '%s' "$SSH_PORT" | tr -d '\r\n')"
          SSH_USER="$(printf '%s' "$SSH_USER" | tr -d '\r\n')"
          SSH_HOST="$(printf '%s' "$SSH_HOST" | tr -d '\r\n')"

          ssh -i "$HOME/.ssh/id_deploy" -p "$SSH_PORT" -o StrictHostKeyChecking=yes -o ConnectTimeout=20 "$SSH_USER@$SSH_HOST" \
            "DP='$TARGET'; if [ -d \"\$DP\" ]; then BK=\"\${DP%/}.backup-$(date +%Y%m%d%H%M%S)\"; if cp -a \"\$DP\" \"\$BK\"; then ls -dt \"\${DP%/}\".backup-* 2>/dev/null | tail -n +6 | xargs -r rm -rf; echo 'Backup creado y retención aplicada.'; else echo 'No se pudo crear el backup; se aborta el despliegue.' >&2; exit 1; fi; else echo 'Primer despliegue: no existe contenido previo.'; fi"

      - name: Sincronizar out/ hacia Hostinger
        env:
          SSH_USER: ${{ secrets.HOSTINGER_USERNAME }}
          SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_PORT }}
        run: |
          SSH_PORT="$(printf '%s' "$SSH_PORT" | tr -d '\r\n')"
          SSH_USER="$(printf '%s' "$SSH_USER" | tr -d '\r\n')"
          SSH_HOST="$(printf '%s' "$SSH_HOST" | tr -d '\r\n')"

          rsync -az --delete \
            --exclude='.well-known/' \
            --exclude='cgi-bin/' \
            --exclude='.htpasswd' \
            --exclude='.user.ini' \
            --exclude='error_log' \
            --exclude='__docroot_probe_*.txt' \
            -e "ssh -i $HOME/.ssh/id_deploy -p $SSH_PORT -o StrictHostKeyChecking=yes -o ConnectTimeout=20" \
            out/ "$SSH_USER@$SSH_HOST:$TARGET/"

          echo "Sincronización completada."

      - name: Verificar que la web sirve este commit
        run: |
          sleep 5
          URL="https://licitatis.es/__build_sha.txt?cb=${DEPLOY_SHA}"
          GOT="$(curl -fsS "$URL" 2>/dev/null | tr -d '\r\n' || true)"
          if [ "$GOT" != "$DEPLOY_SHA" ]; then
            echo "::error::La web pública no sirve el commit desplegado. Esperado '$DEPLOY_SHA', obtenido '${GOT:-<vacío o 404>}'."
            exit 1
          fi
          echo "Verificado: licitatis.es sirve el commit $DEPLOY_SHA."

      - name: Resumen del despliegue
        run: echo "Desplegado el commit $DEPLOY_SHA en Hostinger ($TARGET)."
